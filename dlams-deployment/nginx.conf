events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Share links are public: limit how fast one address can open them.
    limit_req_zone $binary_remote_addr zone=share_links:10m rate=30r/m;
    limit_req_status 429;

    upstream api {
        server api:8000;
    }

    # The UI image serves its own built files (SPA fallback included) on 3000.
    upstream ui {
        server ui:3000;
    }

    # Redirect HTTP to HTTPS
    server {
        listen 80;
        server_name dontlookatmystuff.com api.dontlookatmystuff.com;
        return 301 https://$host$request_uri;
    }

    # UI Server - dontlookatmystuff.com
    server {
        listen 443 ssl;
        server_name dontlookatmystuff.com;

        ssl_certificate /etc/letsencrypt/live/dontlookatmystuff.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/dontlookatmystuff.com/privkey.pem;

        client_max_body_size 100M;

        # Serve UI from the UI container
        location / {
            proxy_pass http://ui;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Share-link pages: not indexed, and the URL is never sent as a referrer
        location /s/ {
            proxy_pass http://ui;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header X-Robots-Tag "noindex" always;
            add_header Referrer-Policy "no-referrer" always;
        }

        location /api/shared/ {
            limit_req zone=share_links burst=10 nodelay;
            proxy_pass http://api/shared/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header X-Robots-Tag "noindex" always;
            add_header Referrer-Policy "no-referrer" always;
        }

        # Proxy API requests to backend (for UI to call API)
        location /api/ {
            proxy_pass http://api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # API Server - api.dontlookatmystuff.com
    server {
        listen 443 ssl;
        server_name api.dontlookatmystuff.com;

        ssl_certificate /etc/letsencrypt/live/api.dontlookatmystuff.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.dontlookatmystuff.com/privkey.pem;

        client_max_body_size 100M;

        location / {
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /shared/ {
            limit_req zone=share_links burst=10 nodelay;
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header X-Robots-Tag "noindex" always;
            add_header Referrer-Policy "no-referrer" always;
        }

        location /static/ {
            alias /app/static/;
        }
    }
}