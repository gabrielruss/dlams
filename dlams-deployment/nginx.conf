events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    upstream api {
        server api:8000;
    }

    # Redirect HTTP to HTTPS
    server {
        listen 80;
        server_name dontlookatmystuff.com api.dontlookatmystuff.com;
        return 301 https://$host$request_uri;
    }

    # UI Server - dontlookatmystuff.com
    server {
        listen 443 ssl;
        server_name dontlookatmystuff.com;

        ssl_certificate /etc/letsencrypt/live/dontlookatmystuff.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/dontlookatmystuff.com/privkey.pem;

        client_max_body_size 100M;

        # Serve UI
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
            index index.html;
        }

        # Proxy API requests to backend (for UI to call API)
        location /api/ {
            proxy_pass http://api:8000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # API Server - api.dontlookatmystuff.com
    server {
        listen 443 ssl;
        server_name api.dontlookatmystuff.com;

        ssl_certificate /etc/letsencrypt/live/api.dontlookatmystuff.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.dontlookatmystuff.com/privkey.pem;

        client_max_body_size 100M;

        location / {
            proxy_pass http://api:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /static/ {
            alias /app/static/;
        }
    }
}