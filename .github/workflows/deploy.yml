name: Deploy to Raspberry Pi

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: [self-hosted, deploy-pi]
    steps:
      - name: Pull and rebuild
        run: |
          cd ~/dlams
          git pull origin main
          cd dlams-deployment
          docker compose up -d --build api ui nginx
          docker compose up -d --force-recreate nginx
          docker compose ps
