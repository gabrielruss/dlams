name: Deploy to Raspberry Pi

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: [self-hosted, deploy-pi]
    steps:
      - name: Pull and rebuild
        env:
          VITE_DEMO_USERNAME: demo-user
          VITE_DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
        run: |
          cd ~/dlams
          git pull origin main
          cd dlams-deployment
          docker compose up -d --build api ui nginx
          docker compose exec -T nginx nginx -s reload
          docker compose ps
