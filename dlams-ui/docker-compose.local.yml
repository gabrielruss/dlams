services:
  ui:
    build:
      context: .
      dockerfile: Dockerfile.local
    restart: always
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000

  nginx:
    image: nginx:latest
    ports:
      - "8080:80" # Changed to port 8080
    volumes:
      - ./nginx.local.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - ui
