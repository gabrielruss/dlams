# Redirect all HTTP requests to HTTPS for both domains
server {
    listen 80;
    server_name api.dontlookatmystuff.com dontlookatmystuff.com;
    return 301 https://$host$request_uri;
}

# Main UI - dontlookatmystuff.com
server {
    listen 443 ssl;
    server_name dontlookatmystuff.com;

    ssl_certificate /etc/letsencrypt/live/dontlookatmystuff.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dontlookatmystuff.com/privkey.pem;

    # Serve UI
    location / {
        proxy_pass http://dlams-ui-ui-1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://app:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# API subdomain - api.dontlookatmystuff.com
server {
    listen 443 ssl;
    server_name api.dontlookatmystuff.com;

    ssl_certificate /etc/letsencrypt/live/api.dontlookatmystuff.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.dontlookatmystuff.com/privkey.pem;

    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}